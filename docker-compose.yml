services:
  mongodb:
    image: mongo:latest
    container_name: vedaai-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - vedaai-network

  redis:
    image: redis:alpine
    container_name: vedaai-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - vedaai-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  vedaai-network:
    driver: bridge
